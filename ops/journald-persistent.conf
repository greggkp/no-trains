# Raspberry Pi OS ships /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf
# (Storage=volatile), so every reboot discards the journal and, with it, the
# reason a refresh dispatch failed. Keep the journal on disk, bounded so it
# cannot fill the SD card. Installed as
# /etc/systemd/journald.conf.d/50-no-trains-persistent.conf.
[Journal]
Storage=persistent
SystemMaxUse=256M
