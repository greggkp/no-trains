name: Update calendar

on: workflow_dispatch

# Feeds are published straight to GitHub Pages as a build artifact — nothing
# is pushed back to main, so branch protection on main can stay strict.
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest -v

  update:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      degraded: ${{ steps.generate.outputs.degraded }}
      total_events: ${{ steps.generate.outputs.total_events }}
      fallback_events: ${{ steps.generate.outputs.fallback_events }}
      detail_failures: ${{ steps.generate.outputs.detail_failures }}
      ptv_mismatches: ${{ steps.generate.outputs.ptv_mismatches }}
      ptv_errors: ${{ steps.generate.outputs.ptv_errors }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Generate ICS feeds
        id: generate
        # PTV keys are optional: without them the generator falls back to
        # parsing the feed's human-readable times.
        env:
          PTV_DEV_ID: ${{ secrets.PTV_DEV_ID }}
          PTV_API_KEY: ${{ secrets.PTV_API_KEY }}
        run: python generate_ics.py

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # v5+ of upload-pages-artifact SHA-pins its internal upload-artifact,
      # which the repo's required-SHA-pinning policy also applies to.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # Keep notification separate from `update`: if the test job fails, `update`
  # is skipped, but this job still runs and reports the hard failure.
  notify:
    needs: [test, update]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Optional dead-man switch. A missing secret makes this a no-op, so
      # forks and local setup do not need a Healthchecks.io account.
      - name: Report pipeline heartbeat
        id: heartbeat
        if: always()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          TEST_RESULT: ${{ needs.test.result }}
          UPDATE_RESULT: ${{ needs.update.result }}
          DEGRADED: ${{ needs.update.outputs.degraded }}
        run: |
          if [[ -z "$HEALTHCHECK_URL" ]]; then
            echo "HEALTHCHECK_URL is not configured; skipping heartbeat"
            exit 0
          fi

          endpoint="${HEALTHCHECK_URL%/}"
          if [[ "$TEST_RESULT" != success || "$UPDATE_RESULT" != success || "$DEGRADED" == true ]]; then
            endpoint="$endpoint/fail"
          fi
          curl --fail --silent --show-error --max-time 10 --retry 3 "$endpoint"

      - name: Notify on failure or degradation
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Passed via env rather than interpolated into the script so output
          # values can never be parsed as JavaScript.
          TEST_RESULT: ${{ needs.test.result }}
          UPDATE_RESULT: ${{ needs.update.result }}
          HEARTBEAT_RESULT: ${{ steps.heartbeat.outcome }}
          DEGRADED: ${{ needs.update.outputs.degraded }}
          TOTAL_EVENTS: ${{ needs.update.outputs.total_events }}
          FALLBACK_EVENTS: ${{ needs.update.outputs.fallback_events }}
          DETAIL_FAILURES: ${{ needs.update.outputs.detail_failures }}
          PTV_MISMATCHES: ${{ needs.update.outputs.ptv_mismatches }}
          PTV_ERRORS: ${{ needs.update.outputs.ptv_errors }}
        with:
          script: |
            const label = 'calendar-pipeline';
            const testResult = process.env.TEST_RESULT;
            const updateResult = process.env.UPDATE_RESULT;
            const heartbeatResult = process.env.HEARTBEAT_RESULT;
            const failed = testResult !== 'success'
              || updateResult !== 'success'
              || heartbeatResult !== 'success';
            const degraded = process.env.DEGRADED === 'true';
            const total = process.env.TOTAL_EVENTS;
            const fallback = process.env.FALLBACK_EVENTS;
            const detail = process.env.DETAIL_FAILURES;
            const ptvMismatches = process.env.PTV_MISMATCHES;
            const ptvErrors = process.env.PTV_ERRORS;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch (e) {
              await github.rest.issues.createLabel({
                ...context.repo, name: label, color: 'd73a4a',
                description: 'Calendar generation pipeline alerts',
              });
            }

            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: label,
            });
            const issue = open.data[0];

            if (failed || degraded) {
              const kind = failed
                ? 'Hard failure — tests, generation, deploy, or heartbeat failed (see logs).'
                : 'Soft degradation — entries fell back to all-day, detail scrapes failed, or the PTV API errored/disagreed with the feed.';
              const body = [
                `**${kind}**`, '',
                `- Run: ${runUrl}`,
                `- test: ${testResult || 'n/a'}`,
                `- update: ${updateResult || 'n/a'}`,
                `- heartbeat: ${heartbeatResult || 'n/a'}`,
                `- total_events: ${total || 'n/a'}`,
                `- fallback_events: ${fallback || 'n/a'}`,
                `- detail_failures: ${detail || 'n/a'}`,
                `- ptv_mismatches: ${ptvMismatches || 'n/a'}`,
                `- ptv_errors: ${ptvErrors || 'n/a'}`,
                '',
                'The unofficial Metro planned-works feed/markup may have changed.',
              ].join('\n');
              if (issue) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: issue.number, body,
                });
              } else {
                await github.rest.issues.create({
                  ...context.repo,
                  title: '⚠️ Calendar generation needs attention',
                  labels: [label], body,
                });
              }
            } else if (issue) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: `Recovered — clean run. ${runUrl}`,
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: issue.number, state: 'closed',
              });
            }
